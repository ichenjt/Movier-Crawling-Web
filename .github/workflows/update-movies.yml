name: 更新電影場次

on:
  schedule:
    # 每天台灣時間 06:00 (UTC 22:00 前一天) 執行
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "抓取未來幾天的場次"
        required: false
        default: "14"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Run crawlers
        run: |
          DAYS=${{ github.event.inputs.days || '14' }}
          python update_movies.py --days $DAYS --output movie_rows.json

      - name: Check if data changed
        id: check_changes
        run: |
          if git diff --quiet movie_rows.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            LINES=$(python -c "import json; d=json.load(open('movie_rows.json')); print(len(d))")
            echo "rows=$LINES" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated data
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add movie_rows.json
          git commit -m "chore: 更新電影場次資料 (${{ steps.check_changes.outputs.rows }} 筆) [skip ci]"
          git push
